name: Release Chrome extension

# Procédure complète : docs/RELEASE.md.
# - Tag `vX.Y.Z` (identique à la version de package.json) : contrôles complets
#   (lint, types, tests sous 3 fuseaux, e2e) et zip ; si tout passe, envoi sur
#   le Chrome Web Store AVEC publication automatique (soumise à l'examen de
#   Google), puis release GitHub publiée avec les notes du changelog.
#   Si un contrôle échoue, rien n'est envoyé ni publié.
# - Lancement manuel (« Run workflow ») : répétition générale, mêmes contrôles
#   et zip en artefact, et vérification en lecture seule de l'accès au Chrome
#   Web Store ; ni envoi, ni publication, ni release GitHub.
#
# Accès au Chrome Web Store sans clé ni jeton à renouveler, comme ProperTease :
# fédération d'identité GitHub → Google Cloud (compte de service lié au store),
# puis appels directs à l'API v2 du store. Configuration (docs/RELEASE.md) :
#   variables : GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT ;
#   secret : CI_GOOGLE_PUBLISHER_ID (identifiant d'éditeur du compte développeur).
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

# Jeton GitHub en lecture seule par défaut ; seuls les jobs qui en ont besoin
# reçoivent davantage (github-release : contents: write ; upload : id-token).
# Les actions sont épinglées par SHA de commit (Dependabot les met à jour).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Contrôles complets et zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Avant les contrôles (plusieurs minutes) : une configuration absente ferait
      # échouer l'envoi au store seulement après eux
      - name: L'accès au Chrome Web Store est configuré
        env:
          PUBLISHER_ID: ${{ secrets.CI_GOOGLE_PUBLISHER_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$PUBLISHER_ID" ] || missing="$missing secret:CI_GOOGLE_PUBLISHER_ID"
          [ -n "$WIF_PROVIDER" ] || missing="$missing variable:GCP_WIF_PROVIDER"
          [ -n "$SERVICE_ACCOUNT" ] || missing="$missing variable:GCP_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Configuration manquante (Settings → Secrets and variables → Actions) :$missing"
            exit 1
          fi

      # WXT reprend la version de package.json dans le manifest
      - name: Le tag correspond à la version de package.json
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ≠ version de package.json v${version}"
            exit 1
          fi

      - name: Le changelog décrit cette version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de section « ## [${version}] »"
            exit 1
          fi

      - name: Lint, types, tests unitaires, build
        run: npm run check

      - name: Tests unitaires sous plusieurs fuseaux horaires
        run: npm run test:tz

      - name: Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Scénarios de bout en bout
        run: npx playwright test

      - name: Construction du zip (WXT)
        run: npm run zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: .output/pecunio-*-chrome.zip
          # .output est un dossier caché : ignoré par défaut depuis upload-artifact v4.4,
          # le zip n'était pas envoyé et la publication échouait au job suivant (v0.6.0)
          include-hidden-files: true
          if-no-files-found: error

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  github-release:
    name: Release GitHub
    runs-on: ubuntu-latest
    # Publiée seulement une fois la version envoyée et publiée sur le store
    needs: [build, upload]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chrome-extension

      # Notes : section du changelog pour cette version, puis la liste des PR
      # générée par GitHub.
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" pecunio-*-chrome.zip \
            --verify-tag --generate-notes \
            --title "Pecunio $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  # Référence API v2 : https://developer.chrome.com/docs/webstore/api
  # Fédération d'identité : https://github.com/google-github-actions/auth
  upload:
    name: Publier sur le Chrome Web Store
    runs-on: ubuntu-latest
    # Seulement si tous les contrôles du job build sont passés. Lancement manuel :
    # vérification de l'accès seulement (lecture), rien n'est envoyé.
    needs: build
    # Environnement protégé : approbation du mainteneur avant tout accès au store,
    # et seulement depuis un tag v* ou main (Settings → Environments)
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write   # jeton GitHub échangé contre un jeton Google, sans clé
    env:
      ITEM: publishers/${{ secrets.CI_GOOGLE_PUBLISHER_ID }}/items/jeomdpldhaigmdbjobamliaipijhmiie
      API: https://chromewebstore.googleapis.com
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'push'
        with:
          name: chrome-extension

      - name: Authentification Google (fédération d'identité)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      # Lecture seule : l'extension est accessible avec ce compte de service
      - name: Accès à la fiche de l'extension
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$TOKEN"
          status=$(curl -sS "$API/v2/$ITEM:fetchStatus" -H "Authorization: Bearer $TOKEN")
          if echo "$status" | jq -e '.error' >/dev/null; then
            echo "$status" | jq '.error | {code, status, message}'
            echo "::error::Fiche inaccessible : compte de service non ajouté au tableau de bord du store, ou identifiant d'éditeur erroné (docs/RELEASE.md)."
            exit 1
          fi
          echo "Fiche accessible."
          echo "$status" | jq '{lastAsyncUploadState, publishedItemRevisionStatus: (.publishedItemRevisionStatus.state // null)}' || true

      # Publication automatique dès que la CI passe (décision du 22/11/2026) :
      # la version est soumise à l'examen de Google, puis publiée par le store.
      - name: Envoi et soumission à l'examen
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$TOKEN"
          zip=$(ls pecunio-*-chrome.zip)
          echo "Envoi de $zip…"
          up=$(curl -sS -X POST "$API/upload/v2/$ITEM:upload" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" --data-binary "@$zip")
          echo "$up"
          state=$(echo "$up" | jq -r '.uploadState // empty')
          for i in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            st=$(curl -sS "$API/v2/$ITEM:fetchStatus" -H "Authorization: Bearer $TOKEN")
            state=$(echo "$st" | jq -r '.. | .uploadState? // empty' | head -1)
            echo "… $state"
          done
          if [ "$state" != "SUCCEEDED" ]; then echo "::error::Envoi refusé ($state) : voir la réponse ci-dessus."; exit 1; fi
          pub=$(curl -sS -X POST "$API/v2/$ITEM:publish" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"publishType":"DEFAULT_PUBLISH","blockOnWarnings":true}')
          echo "$pub"
          if echo "$pub" | jq -e '.error' >/dev/null; then echo "::error::Soumission refusée : voir la réponse ci-dessus."; exit 1; fi
          {
            echo "### Pecunio ${GITHUB_REF_NAME} soumis au Chrome Web Store"
            echo "État : \`$(echo "$pub" | jq -r '.state // "?"')\`. Publication après l'examen de Google."
          } >> "$GITHUB_STEP_SUMMARY"
