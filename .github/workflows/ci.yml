name: CI

on:
  pull_request:
  push:
    branches: [main]

# Jeton GitHub en lecture seule : npm ci exécute les scripts d'installation
# des dépendances, qui n'ont besoin d'aucun droit d'écriture sur le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & build de l'extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Types (tsc, JSDoc)
        run: npm run typecheck

      - name: Build et zip (WXT)
        run: npm run zip

  test:
    name: Tests unitaires (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Certains bugs de dates n'apparaissent qu'à l'est ou à l'ouest de UTC.
        tz: [Europe/Paris, America/New_York, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vitest
        if: matrix.tz != 'Europe/Paris'
        run: npm test

      - name: Vitest + couverture
        if: matrix.tz == 'Europe/Paris'
        run: npm run test:coverage

      - name: Rapport de couverture
        if: matrix.tz == 'Europe/Paris' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build et scénarios e2e
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
